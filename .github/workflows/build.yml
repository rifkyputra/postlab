name: CI - Build binaries

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build:
    # Trigger on tag push OR commit message containing #build
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    strategy:
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            use-cross: false
          - name: linux-aarch64
            target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-latest
            use-cross: true
          - name: macos-x86_64
            target: x86_64-apple-darwin
            runs-on: macos-13
            use-cross: false
          - name: macos-aarch64
            target: aarch64-apple-darwin
            runs-on: macos-latest
            use-cross: false
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --release -p postlab --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.use-cross }}
        run: cargo build --release -p postlab --target ${{ matrix.target }}

      - name: Package artifact
        run: |
          BIN=target/${{ matrix.target }}/release/postlab
          if [ -f "$BIN" ]; then
            tar -czf postlab-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release postlab
            ls -lh postlab-${{ matrix.target }}.tar.gz
          else
            echo "Binary not found at $BIN"
            ls -R target/${{ matrix.target }}/release || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: postlab-${{ matrix.target }}
          path: postlab-${{ matrix.target }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release_files
          find artifacts -name "*.tar.gz" -exec cp {} release_files/ \;
          ls -lh release_files/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release_files/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
